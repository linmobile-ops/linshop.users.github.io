<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--line:rgba(15,23,42,.08);--pri:#4f46e5;--pri2:#6366f1;--pri-soft:#eef2ff;
 --ok:#047857;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;--info:#0369a1;--info-soft:#e0f2fe;--mute-soft:#e2e8f0}
html{background:#eef2ff}
body{font-family:'Noto Sans Myanmar','Padauk','Myanmar Text','Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.7;color:var(--ink);min-height:100vh;
 background:linear-gradient(165deg,#e8edff 0%,#f3eeff 48%,#e4f6ff 100%) fixed;position:relative;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none}
body::before{width:320px;height:320px;background:#a5b4fc;top:-90px;left:-90px;opacity:.5}
body::after{width:360px;height:360px;background:#67e8f9;bottom:-120px;right:-110px;opacity:.32}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
header{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 22px;border-radius:0 0 28px 28px;box-shadow:0 14px 30px -14px rgba(30,27,75,.6)}
.brand{display:flex;align-items:center;gap:12px;max-width:480px;margin:0 auto}
.brand img{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:4px;object-fit:contain}
.brand h1{font-size:17px;font-weight:700;line-height:1.45}.brand p{font-size:12px;opacity:.75;line-height:1.5}
main{max-width:480px;margin:-4px auto 0;padding:18px 16px 0}
.card{background:rgba(255,255,255,.78);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 14px 34px -10px rgba(49,46,129,.18),inset 0 1px 0 #fff;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.chip-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--pri-soft);color:var(--pri)}
h2{font-size:15px;font-weight:700;color:#1e1b4b;line-height:1.5}
.sub{font-size:12.5px;color:var(--ink2);margin:2px 0 14px}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:18px}
input{width:100%;min-height:50px;padding:12px 14px 12px 44px;border-radius:15px;border:1px solid rgba(15,23,42,.1);background:rgba(255,255,255,.9);font:inherit;font-size:16px;outline:none;color:var(--ink)}
input:focus{border-color:var(--pri2);box-shadow:0 0 0 4px rgba(99,102,241,.16)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:15px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#4f46e5,#6366f1);box-shadow:0 8px 18px -6px rgba(79,70,229,.55);transition:transform .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.soft{background:var(--pri-soft);color:var(--pri);box-shadow:none;margin-top:10px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.msg{text-align:center;color:var(--ink2);font-size:13.5px;padding:10px 6px;line-height:1.8}.msg .ic{display:block;margin:0 auto 6px;font-size:30px;color:var(--ink3)}.msg.err .ic{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.model{font-size:16.5px;font-weight:800;line-height:1.5;word-break:break-word}.issue{font-size:13px;color:var(--ink2);word-break:break-word}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b0{background:var(--warn-soft);color:var(--warn)}.b1{background:var(--info-soft);color:var(--info)}.b2{background:var(--ok-soft);color:var(--ok)}.b3{background:var(--mute-soft);color:#334155}.b4{background:var(--bad-soft);color:var(--bad)}
.steps{display:flex;margin:20px 0 12px}
.step{flex:1;text-align:center;position:relative;font-size:11px;color:var(--ink3);line-height:1.5}
.step::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:#dbe2ee;z-index:0;border-radius:3px}
.step:first-child::before{display:none}
.dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:#e2e8f0;color:#94a3b8;margin:0 auto 5px;display:grid;place-items:center;font-size:16px;border:3px solid #f8fafc}
.step.on{color:#3730a3;font-weight:700}.step.on::before{background:#818cf8}
.step.on .dot{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff}
.step.cur .dot{box-shadow:0 0 0 5px rgba(99,102,241,.2)}
.step.fin .dot{background:linear-gradient(135deg,#047857,#10b981)}.step.fin::before{background:#34d399}.step.fin{color:var(--ok)}
.desc{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.7;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.desc .ic{font-size:18px;margin-top:2px}
.d0{background:var(--warn-soft);color:#78350f}.d1{background:var(--info-soft);color:#0c4a6e}.d2{background:var(--ok-soft);color:#064e3b}.d3{background:var(--mute-soft);color:#334155}.d4{background:var(--bad-soft);color:#7f1d1d}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-top:1px dashed #e2e8f0;color:#334155}
.row span{display:flex;align-items:center;gap:6px}.row b{color:var(--ink);text-align:right}
.bal{color:var(--bad)}.ok{color:var(--ok)}
.sec{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:#64748b;padding:6px 16px;text-align:center}
.shop-call{margin-top:2px}
</style>
</head>

<main>
  <section class="card">
    <div class="card-h"><div class="chip-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-phone"/></svg></div><h2>သင့်ဖုန်း ဘယ်အခြေအနေ ရောက်ပြီလဲ</h2></div>
    <p class="sub">ဖုန်းပြင်ရန် ပေးစဉ် ပေးခဲ့သော ဖုန်းနံပါတ်ကို ထည့်ပါ</p>
    <div class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><input type="tel" id="ph" inputmode="tel" placeholder="ဥပမာ 09xxxxxxxxx" autocomplete="tel" aria-label="ဖုန်းနံပါတ်"></div>
    <button class="btn" id="go" onclick="lookup()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg> စစ်ဆေးမည်</button>
  </section>
  <div id="out" aria-live="polite"></div>
  <div class="sec"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shield"/></svg> ထည့်သွင်းသော ဖုန်းနံပါတ်နှင့် ကိုက်ညီသည့် မှတ်တမ်းကိုသာ ပြသပါသည်</div>
</main>
<script>
const API="https://sheetdb.io/api/v1/jjdedskalyu5j";
const SHOP={phone:""};   // ဆိုင်ဖုန်းနံပါတ် ထည့်ပါက "ဆိုင်သို့ ဖုန်းခေါ်ရန်" ခလုတ် ပေါ်လာမည် (ဥပမာ "09123456789")
const I=(n,c)=>`<svg class="ic ${c||""}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const ST={
  wait:{i:0,t:"လက်ခံပြီး",d:"သင့်ဖုန်းကို လက်ခံထားပါပြီ၊ မကြာမီ စတင်ပြင်ဆင်ပါမည်။",ic:"hourglass"},
  doing:{i:1,t:"ပြင်ဆင်နေသည်",d:"သင့်ဖုန်းကို ပြင်ဆင်နေပါသည်။",ic:"wrench"},
  done:{i:2,t:"ပြင်ပြီးပါပြီ",d:"ပြင်ဆင်ပြီးပါပြီ၊ ဆိုင်သို့ လာရောက်ယူနိုင်ပါပြီ။",ic:"check"},
  picked:{i:3,t:"ထုတ်ပေးပြီး",d:"ဖုန်းကို ပြန်လည်ထုတ်ပေးပြီး ဖြစ်ပါသည်။",ic:"box"},
  fail:{i:4,t:"ပြင်၍မရပါ",d:"စိတ်မကောင်းပါ၊ ဤဖုန်းကို ပြင်၍ မရနိုင်ပါ။ အသေးစိတ်ကို ဆိုင်သို့ ဆက်သွယ်မေးမြန်းပါ။",ic:"xcircle"}
};
const STEPS=[["လက်ခံ","inbox"],["ပြင်ဆင်","wrench"],["ပြီးစီး","check"],["ထုတ်ပေး","box"]];
const p2=x=>String(x).padStart(2,"0");
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseDate(v,withTime){
  v=String(v==null?"":v).trim();if(!v)return "";
  let y,mo,d,h="00",mi="00",m;
  if(/^\d+(\.\d+)?$/.test(v)){const t=new Date(Math.round((parseFloat(v)-25569)*1440)*60000);y=t.getUTCFullYear();mo=t.getUTCMonth()+1;d=t.getUTCDate();h=p2(t.getUTCHours());mi=p2(t.getUTCMinutes());}
  else if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/)){y=+m[1];mo=+m[2];d=+m[3];if(m[4]){h=p2(m[4]);mi=m[5];}}
  else if(m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/)){d=+m[1];mo=+m[2];y=+m[3];if(m[4]){h=p2(m[4]);mi=m[5];}}
  else return "";
  const s=p2(d)+"/"+p2(mo)+"/"+y;return withTime?s+" "+h+":"+mi:s;
}
function digits(s){return String(s).replace(/[၀-၉]/g,c=>"၀၁၂၃၄၅၆၇၈၉".indexOf(c)).replace(/\D/g,"");}
async function search(p){const r=await fetch(API+"/search?phone="+encodeURIComponent(p));if(!r.ok)throw new Error(r.status);const j=await r.json();return Array.isArray(j)?j:[];}
let busy=false;
async function lookup(){
  if(busy)return;
  const out=document.getElementById("out"),btn=document.getElementById("go"),html=btn.innerHTML;
  const d=digits(document.getElementById("ph").value);
  if(d.length<9){out.innerHTML=`<div class="card"><div class="msg err">${I("alert")}ဖုန်းနံပါတ် အပြည့်အစုံ ထည့်ပါ</div></div>`;return;}
  busy=true;btn.disabled=true;btn.innerHTML=I("sync","spin")+" ရှာနေသည်...";out.innerHTML="";
  try{
    const core=d.replace(/^0+/,""),variants=[...new Set([d,"0"+core,core])];
    let rows=[];for(const v of variants){rows=await search(v);if(rows.length)break;}
    rows=rows.filter(r=>r.id).reverse();
    out.innerHTML=rows.length?rows.map(card).join(""):`<div class="card"><div class="msg">${I("search")}ဤဖုန်းနံပါတ်ဖြင့် မှတ်တမ်း မတွေ့ပါ။<br>ဖုန်းနံပါတ် မှန်မမှန် ပြန်စစ်ပါ၊ သို့မဟုတ် ဆိုင်သို့ ဆက်သွယ်ပါ။${shopBtn()}</div></div>`;
  }catch(e){out.innerHTML=`<div class="card"><div class="msg err">${I("alert")}ချိတ်ဆက်မရပါ၊ အင်တာနက်စစ်ပြီး ပြန်ကြိုးစားပါ။</div></div>`;}
  setTimeout(()=>{busy=false;btn.disabled=false;btn.innerHTML=html;},1500);
}
const shopBtn=()=>SHOP.phone?`<a class="btn soft shop-call" href="tel:${esc(SHOP.phone)}" style="text-decoration:none">${I("call")} ဆိုင်သို့ ဖုန်းခေါ်ရန်</a>`:"";
function card(r){
  const st=ST[r.status]||ST.wait,fee=Number(r.fee)||0,paid=Number(r.paid)||0,bal=fee-paid;
  const steps=st.i===4?"":STEPS.map((s,i)=>{const on=i<=st.i,fin=st.i===3&&on;return `<div class="step${on?" on":""}${i===st.i?" cur":""}${fin?" fin":""}"><div class="dot">${i<st.i||fin?I("tick"):I(s[1])}</div>${s[0]}</div>`;}).join("");
  const rcv=parseDate(r.date,true),due=parseDate(r.due,false);
  return `<section class="card">
    <div class="top"><div><div class="model">${esc(r.model)}</div><div class="issue">${esc(r.issue)||""}</div></div><span class="pill b${st.i}">${st.t}</span></div>
    ${steps?`<div class="steps">${steps}</div>`:'<div style="height:12px"></div>'}
    <div class="desc d${st.i}">${I(st.ic)}<span>${st.d}</span></div>
    ${rcv?`<div class="row"><span>${I("clock")}လက်ခံသည့်ရက်</span><b>${rcv}</b></div>`:""}
    ${due?`<div class="row"><span>${I("calendar")}ပြန်ပေးမည့်ရက်</span><b>${due}</b></div>`:""}
    ${fee?`<div class="row"><span>${I("wallet")}ပြင်ခ</span><b>${fee.toLocaleString()} ကျပ်</b></div>
    <div class="row"><span>${I("receipt")}ကျန်ငွေ</span><b class="${bal>0?"bal":"ok"}">${bal>0?bal.toLocaleString()+" ကျပ်":"ရှင်းပြီး"}</b></div>`:""}
    ${st.i===4?shopBtn():""}
  </section>`;
}
document.getElementById("ph").addEventListener("keydown",e=>{if(e.key==="Enter")lookup();});
</script>
</body>
</html>
